[project]
name = "douyin-mcp-server"
version = "0.1.0"
description = "MCP Server for Douyin — let AI read and send Douyin direct messages via browser automation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [
    {name = "Lozzi", email = "jp7454yv4f-sudo@users.noreply.github.com"},
]
dependencies = [
    "mcp>=1.0.0",
    "playwright>=1.40.0",
    "httpx>=0.25.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    # Docker SSE 模式
    "uvicorn>=0.22.0",
    "starlette>=0.27.0",
    "sse-starlette>=1.6.0",
]

[project.urls]
homepage = "https://github.com/jp7454yv4f-sudo/Douyin-mcp"
repository = "https://github.com/jp7454yv4f-sudo/Douyin-mcp"

[project.scripts]
douyin-mcp = "douyin_mcp.server:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["douyin_mcp*"]
